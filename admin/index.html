<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#07131d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Panel Barrio" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Barrio Ice · Panel</title>
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <script src="/admin/theme-init.js"></script>
    <link rel="stylesheet" href="/intro.css" />
    <script defer src="/frozen-ui.js"></script>
    <script defer src="/intro.js"></script>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <section id="barrioIntro" class="barrio-intro" aria-describedby="introStatus" data-intro-panel>
      <span id="introStatus" class="sr-only" role="status">Cargando Barrio Ice</span>
      <div class="intro-visual" aria-hidden="true"><div class="intro-night"><i class="intro-moon"></i><div class="intro-skyline"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><svg class="intro-wire" viewBox="0 0 1000 320" preserveAspectRatio="none"><path pathLength="1" d="M-20 95 C190 30 296 198 488 112 S760 35 1020 105"/><path pathLength="1" d="M716 86v150m-46 0h92m-68-92h44"/></svg><div class="intro-frost"></div><canvas class="intro-snow"></canvas><div class="intro-cube" id="introCube"><span class="ice-shard" style="--sx:-46vw;--sy:-28vh;--sr:-145deg;--tx:-44%;--ty:-48%;--tr:20deg;--d:0ms"></span><span class="ice-shard" style="--sx:42vw;--sy:-35vh;--sr:125deg;--tx:12%;--ty:-54%;--tr:-20deg;--d:70ms"></span><span class="ice-shard" style="--sx:-55vw;--sy:8vh;--sr:72deg;--tx:-58%;--ty:-10%;--tr:67deg;--d:140ms"></span><span class="ice-shard" style="--sx:55vw;--sy:14vh;--sr:-105deg;--tx:43%;--ty:-8%;--tr:-58deg;--d:210ms"></span><span class="ice-shard" style="--sx:-38vw;--sy:42vh;--sr:-74deg;--tx:-37%;--ty:42%;--tr:16deg;--d:280ms"></span><span class="ice-shard" style="--sx:44vw;--sy:41vh;--sr:172deg;--tx:20%;--ty:46%;--tr:76deg;--d:350ms"></span><span class="ice-shard" style="--sx:-14vw;--sy:-47vh;--sr:22deg;--tx:-6%;--ty:-63%;--tr:-40deg;--d:420ms"></span><span class="ice-shard" style="--sx:8vw;--sy:48vh;--sr:145deg;--tx:-8%;--ty:59%;--tr:33deg;--d:490ms"></span><span class="ice-shard" style="--sx:-64vw;--sy:32vh;--sr:-30deg;--tx:-66%;--ty:25%;--tr:-72deg;--d:560ms"></span><span class="ice-shard" style="--sx:64vw;--sy:-4vh;--sr:45deg;--tx:62%;--ty:22%;--tr:88deg;--d:630ms"></span><img id="introMark" src="/assets/brand/logo-mark-dark.webp" width="575" height="504" alt="" decoding="async"/><i class="intro-glint"></i></div><div class="intro-drops"><i></i><i></i><i></i></div><div class="intro-floaters"><i></i><i></i><i></i></div></div>
      <div class="intro-copy" aria-hidden="true"><p class="intro-title"><span>B</span><span>A</span><span>R</span><span>R</span><span>I</span><span>O</span><span class="intro-space"> </span><span>I</span><span>C</span><span>E</span></p><small>PANEL · COLD FLOW · MONTERÍA</small></div><p class="intro-phrase" aria-live="polite">Congelando el barrio…</p><button class="intro-skip" type="button" data-intro-skip>Saltar</button>
    </section>
    <section id="login" class="login">
      <div class="login-card">
        <img
          data-brand="logo-mark"
          width="64"
          height="57"
          alt=""
          src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
        />
        <h1>Panel del barrio</h1>
        <p class="muted">Solo para el negocio.</p>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" type="email" autocomplete="username" inputmode="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>
        <p id="loginError" class="notice error" role="alert"></p>
        <button id="loginButton" class="primary" type="button">Entrar</button>
        <p id="connState" class="muted" aria-live="polite">Conectando…</p>
      </div>
    </section>

    <div id="panel" class="panel hide">
      <header class="admin-top">
        <img
          data-brand="logo-mark"
          width="36"
          height="32"
          alt=""
          src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
        />
        <div class="admin-title">
          <h1>Panel del barrio</h1>
          <p id="welcome" class="muted"></p>
        </div>
        <button
          id="soundToggle"
          class="icon"
          aria-pressed="false"
          aria-label="Activar sonido de pedidos nuevos"
          type="button"
        >
          🔔
        </button>
        <button
          id="theme"
          class="icon"
          aria-label="Cambiar tema"
          type="button"
        >
          ◐
        </button>
        <button id="logout" class="secondary" type="button">Salir</button>
      </header>
      <div id="updateBar" class="notice hide" role="status">
        Hay una versión nueva del panel.
        <button id="updateNow" class="secondary" type="button">Actualizar</button>
      </div>
      <div id="installBar" class="notice install-bar hide" role="status">
        <div class="install-copy">
          <strong>Instala el panel en tu celular</strong>
          <span id="installHelp">Abre el panel desde tu pantalla de inicio.</span>
        </div>
        <button id="installNow" class="secondary" type="button">Instalar</button>
      </div>
      <nav class="admin-nav" role="tablist" aria-label="Secciones del panel">
        <button class="tab active" data-admin-tab="today" role="tab" type="button">
          Hoy
        </button>
        <button class="tab" data-admin-tab="orders" role="tab" type="button">
          Pedidos<span id="newBadge" class="badge"></span>
        </button>
        <button class="tab" data-admin-tab="menu" role="tab" type="button">
          Menú
        </button>
        <button class="tab" data-admin-tab="pos" role="tab" type="button">
          Mostrador
        </button>
        <button class="tab" data-admin-tab="stats" role="tab" type="button">
          Ventas
        </button>
        <button class="tab" data-admin-tab="settings" role="tab" type="button">
          Ajustes
        </button>
      </nav>
      <main id="adminView" tabindex="-1"></main>
    </div>

    <script src="/pricing.js"></script>
    <script src="/shared/menu-schema.js"></script>
    <script src="/admin/stats-core.js"></script>
    <script src="/admin/xlsx-export.js"></script>
    <script src="/admin/pos.js"></script>
    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
