<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#07131d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Panel Barrio" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Barrio Ice · Panel</title>
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon-admin.png" />
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("barrio-ice-theme"));
          var theme =
            saved ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <section id="login" class="login">
      <div class="login-card">
        <img
          data-brand="logo-mark"
          width="64"
          height="57"
          alt=""
          src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
        />
        <h1>Panel del barrio</h1>
        <p class="muted">Solo para el negocio.</p>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" type="email" autocomplete="username" inputmode="email" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>
        <p id="loginError" class="notice error" role="alert"></p>
        <button id="loginButton" class="primary" type="button">Entrar</button>
        <p id="connState" class="muted" aria-live="polite">Conectando…</p>
      </div>
    </section>

    <div id="panel" class="panel hide">
      <header class="admin-top">
        <img
          data-brand="logo-mark"
          width="36"
          height="32"
          alt=""
          src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
        />
        <div class="admin-title">
          <h1>Panel del barrio</h1>
          <p id="welcome" class="muted"></p>
        </div>
        <button
          id="soundToggle"
          class="icon"
          aria-pressed="false"
          aria-label="Activar sonido de pedidos nuevos"
          type="button"
        >
          🔔
        </button>
        <button
          id="theme"
          class="icon"
          aria-label="Cambiar tema"
          type="button"
        >
          ◐
        </button>
        <button id="logout" class="secondary" type="button">Salir</button>
      </header>
      <div id="updateBar" class="notice hide" role="status">
        Hay una versión nueva del panel.
        <button id="updateNow" class="secondary" type="button">Actualizar</button>
      </div>
      <div id="installBar" class="notice install-bar hide" role="status">
        <div class="install-copy">
          <strong>Instala el panel en tu celular</strong>
          <span id="installHelp">Abre el panel desde tu pantalla de inicio.</span>
        </div>
        <button id="installNow" class="secondary" type="button">Instalar</button>
      </div>
      <nav class="admin-nav" role="tablist" aria-label="Secciones del panel">
        <button class="tab active" data-admin-tab="today" role="tab" type="button">
          Hoy
        </button>
        <button class="tab" data-admin-tab="orders" role="tab" type="button">
          Pedidos<span id="newBadge" class="badge"></span>
        </button>
        <button class="tab" data-admin-tab="menu" role="tab" type="button">
          Menú
        </button>
        <button class="tab" data-admin-tab="stats" role="tab" type="button">
          Ventas
        </button>
        <button class="tab" data-admin-tab="settings" role="tab" type="button">
          Ajustes
        </button>
      </nav>
      <main id="adminView" tabindex="-1"></main>
    </div>

    <script src="/pricing.js"></script>
    <script src="/shared/menu-schema.js"></script>
    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
